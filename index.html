<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al'Majid Nafi Rambe</title>

  <!-- Favicon: logo AM -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080808'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6.5' fill='none' stroke='%23c9a84c' stroke-width='.9'/%3E%3Ctext x='16' y='22' font-family='Georgia%2Cserif' font-size='14.5' font-weight='700' fill='%23c9a84c' text-anchor='middle' letter-spacing='-1'%3EAM%3C/text%3E%3C/svg%3E">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-wrap">
    <div class="nav-logo">AM<span>.</span></div>
    <nav class="nav-center" id="nav-center"></nav>
    <div class="nav-right">
      <a href="https://github.com/NaraToMajid" target="_blank" rel="noopener" class="nav-gh">
        <i class="fa-brands fa-github"></i>GitHub
      </a>
      <button class="theme-btn" id="theme-btn" aria-label="Ganti tema">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Nav -->
<div class="mobile-nav" id="mobile-nav">
  <a href="#home" class="mob-link">Home</a>
  <a href="#about" class="mob-link">About</a>
  <a href="#location" class="mob-link">Location</a>
  <a href="#help" class="mob-link">Help</a>
  <a href="https://github.com/NaraToMajid" target="_blank" rel="noopener" class="mob-gh">
    <i class="fa-brands fa-github"></i>GitHub
  </a>
</div>

<!-- HERO SECTION -->
<section id="home">
  <div class="batik-bg"></div>
  <div class="container z1">
    <div class="hero-grid section-pad">
      <!-- Left Column -->
      <div>
        <div class="hero-eyebrow rv">
          <div class="hero-eyebrow-line"></div>
          <span class="hero-eyebrow-text" id="h-tag"></span>
        </div>
        <h1 class="hero-h1 rv d1" id="h-name"></h1>
        <div class="hero-roles rv d2" id="h-roles"></div>
        <div class="hero-cta-row rv d3" id="h-cta"></div>
        <div class="soc-row rv d3" style="margin-top:40px" id="h-socs"></div>

        <!-- Clock + Badge -->
        <div class="hero-clock-wrap rv d4">
          <div class="clock-card">
            <i class="fa-solid fa-clock clock-icon"></i>
            <div>
              <div class="clock-time" id="clock-time">00:00:00</div>
              <div class="clock-date" id="clock-date"></div>
            </div>
          </div>
          <div class="pemula-badge">
            <i class="fa-solid fa-seedling"></i>
            <span class="pemula-text">Masih Pemula Baru Belajar</span>
          </div>
        </div>
      </div>

      <!-- Right Column / Photo -->
      <div class="hero-photo-col rr">
        <div class="photo-wrap" id="h-photo">
          <div class="photo-dot"></div>
          <div class="stat-strip" id="h-stats"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ABOUT SECTION -->
<section id="about">
  <div class="batik-bg"></div>
  <div class="container z1 section-pad">
    <div class="about-grid">
      <!-- Photo Column -->
      <div class="about-photo-col rl">
        <div class="about-img" id="a-img"></div>
        <div class="about-age-badge" id="a-badge"></div>
      </div>

      <!-- Text Column -->
      <div class="about-text">
        <div class="sec-eyebrow rv">Tentang Saya</div>
        <h2 class="sec-title rv d1" id="a-title"></h2>
        <div id="a-bio"></div>
        <div class="gold-line rv d2"></div>

        <div class="skills-block rv d2">
          <div class="block-label">Keahlian</div>
          <div class="chip-row" id="a-skills"></div>
        </div>

        <div class="skills-block rv d3" style="margin-top:18px">
          <div class="block-label">Tech Stack</div>
          <div class="tech-row" id="a-tech"></div>
        </div>

        <div class="info-cards rv d4" id="a-info"></div>
      </div>
    </div>
  </div>
</section>

<!-- LOCATION SECTION -->
<section id="location">
  <div class="batik-bg"></div>
  <div class="container z1 section-pad">
    <div class="sec-eyebrow rv">Lokasi</div>
    <h2 class="sec-title rv d1">Rantauprapat,<br><em>Sumatera Utara</em></h2>
    <div class="loc-grid">
      <div class="loc-list" id="loc-list"></div>
      <div class="map-frame rv d2">
        <div class="map-badge">
          <i class="fa-solid fa-location-dot"></i>Rantauprapat
        </div>
        <iframe
          src="https://www.openstreetmap.org/export/embed.html?bbox=99.8077%2C2.0546%2C99.8437%2C2.0846&layer=mapnik&marker=2.0763%2C99.8298"
          allowfullscreen loading="lazy"
          title="Lokasi Al'Majid — Rantauprapat">
        </iframe>
      </div>
    </div>
  </div>
</section>

<!-- HELP / CONTACT SECTION -->
<section id="help">
  <div class="batik-bg"></div>
  <div class="container z1 section-pad">
    <div class="help-grid">
      <!-- Contact Info -->
      <div>
        <div class="sec-eyebrow rv">Hubungi Saya</div>
        <h2 class="sec-title rv d1" id="hp-title"></h2>
        <div class="contact-list" id="hp-cards"></div>
        <div class="soc-row rv" id="hp-socs"></div>
      </div>

      <!-- Form -->
      <div class="form-card rv d2">
        <h3 class="form-card-title">Kirim Pesan</h3>
        <p class="form-card-sub">Isi form berikut, saya akan segera membalas.</p>
        <form id="contact-form" novalidate>
          <div class="fg-2">
            <div class="fg">
              <label>Nama</label>
              <input type="text" id="f-name" placeholder="Nama Anda" required>
            </div>
            <div class="fg">
              <label>Email</label>
              <input type="email" id="f-email" placeholder="email@anda.com" required>
            </div>
          </div>
          <div class="fg">
            <label>Jenis Kolaborasi</label>
            <select id="f-type">
              <option value="">Pilih jenis...</option>
              <option>Web Development</option>
              <option>Visual Design</option>
              <option>Photography</option>
              <option>Videography</option>
              <option>Video Editing</option>
              <option>Konsultasi</option>
              <option>Lainnya</option>
            </select>
          </div>
          <div class="fg">
            <label>Pesan</label>
            <textarea id="f-msg" placeholder="Ceritakan proyek atau ide Anda..." required></textarea>
          </div>
          <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center">
            <i class="fa-solid fa-paper-plane"></i>Kirim Pesan
          </button>
          <div class="form-msg" id="form-msg"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="foot-wrap">
    <div class="foot-logo" id="f-logo"></div>
    <p class="foot-copy" id="f-copy"></p>
    <div class="foot-socs" id="f-socs"></div>
  </div>
</footer>

<!-- External JavaScript -->
<script src="script.js"></script>
</body>
</html>
