<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAJIDNAFI - GOD TIER CYBER NEON</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; cursor: none; }
        canvas { display: block; }
        /* Efek Vignet agar layar terasa seperti monitor tabung retro/sinematik */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // 1. SETUP SUPERIOR
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02); // Kabut pekat di kejauhan

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. ENDLESS SYNTHWAVE GRID (Lantai Neon)
    const gridHelper = new THREE.GridHelper(200, 100, 0xff00ff, 0x003344);
    gridHelper.position.y = -3;
    scene.add(gridHelper);

    // 3. CURSOR TRACKER (Cahaya mengikuti mouse)
    const mouseLight = new THREE.PointLight(0xffffff, 300, 20);
    scene.add(mouseLight);
    
    // Core Lighting
    scene.add(new THREE.AmbientLight(0x111122));
    const cyanLight = new THREE.PointLight(0x00ffff, 200, 30);
    cyanLight.position.set(-5, 5, 5);
    scene.add(cyanLight);

    // 4. LOAD FONT & BUAT MULTI-LAYER TEXT
    let textGroup = new THREE.Group();
    scene.add(textGroup);

    const loader = new FontLoader();
    loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
        const textGeo = new TextGeometry('ALMAJIDNAFI', {
            font: font, size: 1.5, height: 0.4, curveSegments: 32,
            bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.02, bevelSegments: 16
        });
        textGeo.center();

        // LAYER 1: Inti Padat (Material Gelap Metalik)
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x111111, metalness: 1.0, roughness: 0.1
        });
        const coreMesh = new THREE.Mesh(textGeo, coreMat);
        
        // LAYER 2: Wireframe Holografik (Aura Neon)
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.3
        });
        const wireMesh = new THREE.Mesh(textGeo, wireMat);
        wireMesh.scale.set(1.02, 1.02, 1.02); // Sedikit lebih besar dari inti

        textGroup.add(coreMesh);
        textGroup.add(wireMesh);
    });

    // 5. POST-PROCESSING: BLOOM OVERDRIVE
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    
    // Bloom: Strength ditingkatkan, Threshold diturunkan agar semuanya bersinar
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.8, 0.05);
    composer.addPass(bloomPass);

    // 6. KONTROL DAN INTERAKSI
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.02;
    controls.maxPolarAngle = Math.PI / 2 + 0.1; // Jangan sampai tembus lantai bawah

    // Mouse Tracking (Koordinat dinormalisasi -1 sampai 1)
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. RENDER LOOP (Animasi Dewa)
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // A. Animasi Lantai Bergerak Maju (Endless Grid)
        // Memanfaatkan modulus agar kembali ke titik awal tanpa terlihat patah
        gridHelper.position.z = (t * 8) % 2;

        // B. Mouse Light Tracking (Cahaya menempel di layar bayangan mouse)
        mouseLight.position.x = mouseX * 10;
        mouseLight.position.y = mouseY * 10;
        mouseLight.position.z = 8; // Tetap di depan teks

        // C. Animasi Teks Kompleks
        if (textGroup.children.length > 0) {
            // Efek Melayang Halus
            textGroup.position.y = Math.sin(t * 1.5) * 0.3;
            
            // Efek Bernafas (Skala membesar dan mengecil perlahan)
            const scale = 1 + Math.sin(t * 3) * 0.015;
            textGroup.scale.set(scale, scale, scale);

            // Rotasi Mengikuti Mouse + Goyangan Alami
            textGroup.rotation.x = Math.sin(t) * 0.05 + mouseY * 0.2;
            textGroup.rotation.y = Math.cos(t * 0.8) * 0.05 + mouseX * 0.3;

            // Wireframe berkedip seperti hologram glitch
            textGroup.children[1].material.opacity = 0.2 + Math.random() * 0.2;
            // Warna Wireframe berubah antara Cyan dan Magenta perlahan
            textGroup.children[1].material.color.setHSL((Math.sin(t * 0.5) + 1) * 0.5 * 0.2 + 0.5, 1, 0.5);
        }

        controls.update();
        composer.render();
    }
    
    animate();
</script>
</body>
</html>
